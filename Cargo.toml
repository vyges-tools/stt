[package]
name = "vyges-stt"
version = "0.1.37"
edition = "2021"
description = "Rectilinear Steiner minimal trees over a net's pin locations: FLUTE and Prim-Dijkstra, with the wirelength/depth trade-off."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/stt"

[dependencies]
serde_json = "1"
# The causal trail. ⚠️ `default-features = false` as in the other engines: the trail is
# structured output on stderr, not a logging framework this engine gets to choose.
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }

[[bin]]
name = "vyges-stt"
path = "src/main.rs"

[lib]
name = "vyges_stt"
path = "src/lib.rs"
