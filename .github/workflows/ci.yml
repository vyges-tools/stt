# Build & test on every push to main and on pull requests (plus manual dispatch).
#
# 🔴 PUSH-TRIGGERED ON PURPOSE. Our release tooling derives the set of gating workflows from each
# repo's own `on:` triggers and requires every one green at HEAD, so a repo with no push-triggered
# workflow is reported as "not gated" — which reads like a pass and is actually "nobody looked".
#
# ⚠️ std-only, but NOT network-free: build.rs fetches the FLUTE lookup tables (POWV9/POST9) from
# the OpenROAD commit pinned in flute-tables.yaml, because 9.4 MB of third-party data is a
# provenance SHA here rather than a copy in the tree. That needs `git` on the runner, which
# ubuntu-latest has.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (std-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --locked --verbose
      - name: Test
        run: cargo test --locked --verbose
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
